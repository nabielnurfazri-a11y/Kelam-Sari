const NOTES=[
 {id:`Buku tamu panti tertinggal di meja makan. Baris terakhir: "Perawat Raka, jaga malam, Bangsal C. 12 Maret 1987." Tulisan itu tulisanku sendiri.`,en:`The asylum's guestbook was left on the dining table. Last line: "Nurse Raka, night shift, Ward C. March 12, 1987." The handwriting is my own.`},
 {id:`Foto para staf panti. Seseorang menggores wajah satu orang di barisan belakang dengan paku, begitu dalam hingga kertasnya robek. Aku tidak berani membaliknya.`,en:`A staff photograph. Someone scratched out one face in the back row with a nail, so deep the paper tore. I'm afraid to turn it over.`},
 {id:`Diari Nyonya Hartono: "Suamiku berhenti tidur sejak lonceng itu dipasang. Ia bilang bunyinya menahan mereka tetap di sini. Mereka siapa?"`,en:`Mrs. Hartono's diary: "My husband stopped sleeping once the bell was hung. He says its ringing keeps them here. Them who?"`},
 {id:`Surat Dr. Hartono: "Seorang perawat muda mengunci bangsal C saat api menyebar. Ia selamat. Dua puluh tiga pasien tidak. Aku tidak akan membiarkannya melupakan itu."`,en:`Letter from Dr. Hartono: "A young nurse locked Ward C as the fire spread. He survived. Twenty-three patients did not. I won't let him forget."`},
 {id:`Papan di kandang: "Anjing-anjing ini kelaparan sejak malam itu. Mereka mengejar apa saja yang berlari."`,en:`A sign on the kennel: "These dogs have starved since that night. They chase anything that runs."`},
 {id:`Terukir di bibir sumur: "Mbok Lumpur menolak pergi. Ia menunggu orang yang menjatuhkannya. Ia sudah tahu namanya."`,en:`Carved on the well's rim: "Mother Mud refuses to leave. She waits for the one who dropped her. She already knows the name."`},
 {id:`Daftar pasien bangsal bawah tanah: dua puluh tiga nama. Di samping nama terakhir, tinta basah: "Laras R."`,en:`The basement ward roster: twenty-three names. Beside the last, in wet ink: "Laras R."`},
 {id:`Label laci mayat nomor 23: "Belum meninggal. Dilarang dibuka." Laci itu kosong, dan dari dalamnya terdengar napas.`,en:`Tag on morgue drawer 23: "Not yet dead. Do not open." The drawer is empty, and something inside is breathing.`},
 {id:`Partitur paduan suara: tiap not ditulis sebagai nama pasien. Lagu itu hanya selesai bila semua nama terucap.`,en:`A choir score: every note is written as a patient's name. The song only ends when every name is spoken.`},
 {id:`Dr. Hartono menulis di papan altar: "Lonceng bisa membebaskan atau mengurung. Tergantung siapa yang membunyikannya, dan apa yang ia tahu."`,en:`Dr. Hartono wrote on the altar board: "The bell can free or imprison. It depends on who rings it, and what they know."`},
 {id:`Catatan terapi: "Pasien Laras tidak gila. Ia hanya bisa melihat mereka. Kakaknya, perawat jaga, meminta kami diam."`,en:`Therapy notes: "Patient Laras is not mad. She simply sees them. Her brother, the night nurse, asked us to keep quiet."`},
 {id:`Kunci Bangsal C tidak pernah hilang. Raka membuangnya malam itu agar pintu tak bisa dibuka dari luar, supaya tak ada yang tahu ia meninggalkannya.`,en:`Ward C's key was never lost. Raka threw it away that night so the door couldn't be opened from outside, so no one would learn he left her.`}];

/* ================= MONSTER (lore) ================= */
const MT={
 weeper:{n:{id:`SUSTER RATAPAN`,en:`SISTER WAILING`},lore:{id:`Dulu Suster Ratna, perawat panti. Ia membeku saat ditatap, tapi setiap kali kau berkedip, ia sudah lebih dekat. Jangan lepas pandang darinya.`,en:`Once Sister Ratna, the asylum nurse. She freezes when watched, but every time you blink she is closer. Never take your eyes off her.`},die:{id:`Suster Ratapan menemukanmu. Ia hanya diam selama kau menatapnya, jangan berkedip.`,en:`Sister Wailing found you. She only freezes while you watch her. Never blink.`}},
 crawler:{n:{id:`JOKO SI PERAYAP`,en:`JOKO THE CRAWLER`},lore:{id:`Pasien kamar 9. Matanya dijahit, kakinya dipatahkan. Ia tak bisa melihat, tapi mendengar napasmu. Berjalan pelan atau merunduklah.`,en:`Patient of room 9. His eyes sewn, his legs broken. He cannot see, but he hears your breath. Walk slowly or crouch.`},die:{id:`Joko mendengar langkahmu. Berlari itu berisik. Berjalan pelan atau merunduklah.`,en:`Joko heard your footsteps. Running is loud. Walk slowly or crouch.`}},
 eye:{n:{id:`SANG PENGAWAS`,en:`THE OVERSEER`},lore:{id:`Gumpalan daging penuh mata. Bila kau menatapnya terlalu lama, ia menjerit dan semua makhluk tahu posisimu. Jangan menatap balik.`,en:`A mass of flesh full of eyes. Stare too long and it screams, and every creature learns where you are. Don't stare back.`},die:{id:`Sang Pengawas menjerit dan semua makhluk tahu posisimu.`,en:`The Overseer screamed and every creature knew where you were.`}},
 stitcher:{n:{id:`PAK JAHIT`,en:`MR. STITCH`},lore:{id:`Juru jahit yang menjahit mulut pasien. Ia muncul di belakangmu tanpa suara. Bila terdengar benang ditarik, segera lari.`,en:`The tailor who sewed shut patients' mouths. He appears behind you without a sound. If you hear thread being pulled, run.`},die:{id:`Pak Jahit muncul dari belakangmu. Dengarkan bisikan benang, lalu lari.`,en:`Mr. Stitch appeared behind you. Listen for the whisper of thread, then run.`}},
 sludge:{n:{id:`MBOK LUMPUR`,en:`MOTHER MUD`},lore:{id:`Koki panti yang ditenggelamkan di sumur. Ia lambat, tapi tak pernah berhenti mengikuti jejakmu, dan kakimu terasa berat di dekatnya.`,en:`The asylum cook, drowned in the well. She is slow but never stops following your trail, and your legs feel heavy near her.`},die:{id:`Mbok Lumpur tak pernah berhenti mengikuti jejakmu. Jangan berhenti terlalu lama.`,en:`Mother Mud never stops following your trail. Don't linger.`}},
 butcher:{n:{id:`SANG PENJAGAL`,en:`THE BUTCHER`},lore:{id:`Kepala jaga Darmo. Bila melihatmu, ia menyerbu lurus dengan cepat. Belok di tikungan, atau merunduklah. Setelah menyerbu, ia kelelahan.`,en:`Head guard Darmo. If he sees you he charges in a straight line, fast. Turn a corner, or crouch. After a charge he is exhausted.`},die:{id:`Sang Penjagal menyerbu lurus. Belok di tikungan atau sembunyi sebelum ia melihatmu.`,en:`The Butcher charges straight. Turn a corner or hide before he sees you.`}},
 butler:{n:{id:`PELAYAN PUCAT`,en:`THE PALE BUTLER`},lore:{id:`Karto, pelayan keluarga. Ia berpatroli dengan senyum yang terlalu lebar. Ia melihat dalam kerucut di depannya, jadi jongkok dan matikan senter untuk menyelinap.`,en:`Karto, the family butler. He patrols with a smile far too wide. He sees in a cone ahead of him, so crouch and switch off your light to sneak by.`},die:{id:`Pelayan Pucat melihatmu. Menyelinaplah dengan jongkok dan senter mati.`,en:`The Pale Butler saw you. Sneak by crouching with your light off.`}},
 mimic:{n:{id:`PETI MIMIK`,en:`THE MIMIC`},lore:{id:`Peti tua yang tampak tak berbahaya. Begitu kau mendekat, ia membuka mulut dan menerkam. Lewati dengan jongkok, pelan-pelan.`,en:`An old chest that looks harmless. The moment you get close it opens its jaws and lunges. Slip past crouching, slowly.`},die:{id:`Peti itu hidup dan menerkammu. Jangan mendekati peti yang mencurigakan.`,en:`The chest was alive and lunged. Don't approach suspicious chests.`}},
 ghoul:{n:{id:`HANTU BAK MANDI`,en:`THE BATHTUB GHOUL`},lore:{id:`Mayat bengkak yang menunggu di bak mandi. Ia bangkit begitu kau mendekat, lalu mengejar. Setelah beberapa saat ia kembali ke airnya.`,en:`A bloated corpse waiting in the bathtub. It rises as you approach and gives chase, then slinks back to its water.`},die:{id:`Hantu Bak Mandi bangkit dari air. Jangan mendekati bak mandi.`,en:`The Bathtub Ghoul rose from the water. Stay away from the bathtub.`}},
 hound:{n:{id:`ANJING KURUS`,en:`THE MANGY HOUND`},lore:{id:`Anjing penjaga yang kelaparan. Ia menyerang cepat, mundur, lalu menyerang lagi. Jangan berlari di tempat terbuka.`,en:`A starving guard dog. It strikes fast, retreats, then strikes again. Don't run in the open.`},die:{id:`Anjing Kurus mengejarmu. Ia lebih cepat darimu. Gunakan tikungan dan perabot.`,en:`The Mangy Hound ran you down. It is faster than you. Use corners and furniture.`}},
 scarecrow:{n:{id:`ORANG-ORANGAN SAWAH`,en:`THE SCARECROW`},lore:{id:`Ia tak pernah bergerak, kecuali saat petir menyambar. Tiap kilat membuatnya muncul lebih dekat. Jangan berdiam di tempat terbuka saat badai.`,en:`It never moves, except when lightning strikes. Every flash brings it closer. Don't linger in the open during the storm.`},die:{id:`Orang-orangan Sawah berpindah tiap kilat. Terus bergerak saat petir.`,en:`The Scarecrow moves with every flash. Keep moving during thunder.`}},
 shade:{n:{id:`BAYANGAN`,en:`THE SHADE`},lore:{id:`Bayangan hidup yang membenci cahaya. Sorot ia dengan senter dan ia mundur. Matikan senter dan ia menerkam.`,en:`A living shadow that hates light. Shine your flashlight at it and it recoils. Turn the light off and it pounces.`},die:{id:`Bayangan menerkam dalam gelap. Sorot ia dengan senter.`,en:`The Shade pounced in the dark. Shine your flashlight on it.`}},
 priest:{n:{id:`PENDETA BUTA`,en:`THE BLIND PRIEST`},lore:{id:`Pendeta Lazarus. Ia buta, tapi telinganya sangat tajam. Bila mendengarmu, ia melantunkan doa yang memanggil makhluk lain.`,en:`Father Lazarus. Blind, but his hearing is razor sharp. When he hears you he chants, calling other creatures.`},die:{id:`Pendeta Buta mendengarmu. Jangan berisik di kapel.`,en:`The Blind Priest heard you. Stay quiet in the chapel.`}},
 doctor:{n:{id:`DR. HARTONO`,en:`DR. HARTONO`},lore:{id:`Kepala panti. Ia tahu semua rahasiamu. Ia berpindah tiba-tiba, mengejar tanpa lelah, dan menerkam dari dekat. Jangan berhenti.`,en:`Head of the asylum. He knows all your secrets. He blinks across the room, chases tirelessly and lunges at close range. Don't stop.`},die:{id:`Dr. Hartono tidak pernah kehilangan pasiennya. Jangan berhenti bergerak.`,en:`Dr. Hartono never loses a patient. Never stop moving.`}}
};

 {k:'flee',t:{id:`Pintu Tertutup`,en:`The Closed Door`},hint:{id:`Tinggalkan Laras di Bangsal C.`,en:`Leave Laras behind in Ward C.`},
  lines:[['Laras',`Kak… jangan pergi lagi.`,`Brother… don't leave again.`],['Raka',`Aku tidak bisa. Maafkan aku.`,`I can't. I'm sorry.`],['',`Raka keluar sendirian saat fajar. Pintu Bangsal C tak pernah terbuka lagi, dan tiap malam ia mendengar ketukan pelan dari dalam.`,`Raka walked out alone at dawn. Ward C's door never opened again, and every night he hears a soft knocking from within.`]],
  epi:{id:`Ending 1 · Kau selamat, tapi tidak pernah benar-benar keluar.`,en:`Ending 1 · You survived, but never truly left.`}},
 {k:'forgive',t:{id:`Maaf, Laras`,en:`Forgive Me, Laras`},hint:{id:`Kumpulkan sedikitnya 9 catatan, lalu bunyikan lonceng.`,en:`Collect at least 9 notes, then ring the bell.`},
  lines:[['Raka',`Maafkan aku, Laras. Akulah yang mengunci pintu itu. Aku tidak akan lari lagi.`,`Forgive me, Laras. I'm the one who locked that door. I won't run again.`],['',`Lonceng kecil itu berbunyi, dan kali ini ia membebaskan. Para penghuni panti berhenti, menunduk, lalu memudar menjadi cahaya.`,`The small bell rang, and this time it freed. The asylum's dwellers stopped, bowed, and faded into light.`],['Laras',`Aku sudah memaafkanmu sejak lama, Kak. Ayo pulang.`,`I forgave you long ago, brother. Let's go home.`]],
  epi:{id:`Ending 2 · Kebenaran. Raka dan Laras berjalan keluar menuju pagi. Kelam Sari akhirnya sunyi.`,en:`Ending 2 · The Truth. Raka and Laras walk out into the morning. Kelam Sari is finally silent.`}},
 {k:'cycle',t:{id:`Siklus`,en:`The Cycle`},hint:{id:`Bunyikan lonceng tanpa mengetahui kebenaran.`,en:`Ring the bell without knowing the truth.`},
  lines:[['Raka',`Aku membunyikan lonceng itu tanpa tahu apa yang kuperbuat.`,`I rang the bell without knowing what I had done.`],['Laras',`Kau lupa lagi, Kak.`,`You forgot again, brother.`],['',`Raka terbangun di depan pintu panti. Pintu itu menutup sendiri di belakangnya.`,`Raka woke at the asylum's front door. It shut itself behind him.`]],
  epi:{id:`Ending 3 · Siklus berulang. Kau belum tahu kebenarannya.`,en:`Ending 3 · The cycle repeats. You do not yet know the truth.`}},
 {k:'heir',t:{id:`Pengganti`,en:`The Successor`},hint:{id:`Terima tawaran Dr. Hartono.`,en:`Accept Dr. Hartono's offer.`},
  lines:[['Dr. Hartono',`Kau sudah menjaga mereka lebih baik daripada siapa pun. Pakailah mantel ini.`,`You've kept them better than anyone. Put on this coat.`],['',`Raka menerima mantel itu. Tangannya memucat, matanya kosong, dan di belakangnya sebuah lonceng mulai bergema.`,`Raka took the coat. His hands paled, his eyes emptied, and behind him a bell began to toll.`],['',`Kediaman Kelam Sari memiliki penjaga baru, dan ia tidak pernah tidur.`,`Kelam Sari Manor has a new keeper, and he never sleeps.`]],
  epi:{id:`Ending 4 · Kau menjadi bagian dari panti ini selamanya.`,en:`Ending 4 · You became part of this place forever.`}},
 {k:'fire',t:{id:`Api Penyucian`,en:`Cleansing Fire`},hint:{id:`Bakar kediaman itu.`,en:`Burn the manor down.`},
  lines:[['Raka',`Biar semuanya terbakar. Tak seorang pun boleh terkurung di sini lagi.`,`Let it all burn. No one will be trapped here again.`],['',`Api merambat cepat di sepanjang koridor. Para makhluk menjerit, lalu terdiam satu per satu dalam cahaya jingga.`,`Fire raced down the corridors. The creatures screamed, then fell silent one by one in orange light.`],['',`Raka memandang panti terbakar dari kejauhan. Di antara asap, ia melihat sosok kecil melambai, lalu hilang.`,`Raka watched the asylum burn from afar. Through the smoke he saw a small figure wave, then vanish.`]],
  epi:{id:`Ending 5 · Semuanya jadi abu, termasuk jawaban yang tak sempat kau dengar.`,en:`Ending 5 · Everything turned to ash, including the answers you never heard.`}},
 {k:'dawn',t:{id:`Fajar`,en:`Dawn`},hint:{id:`Bebaskan keenam jiwa, lalu pilih membebaskan mereka semua.`,en:`Free all six souls, then choose to free them all.`},
  lines:[['Raka',`Kalian semua punya nama. Aku mengingat kalian satu per satu… dan Laras.`,`You all have names. I remember each of you… and Laras.`],['',`Jiwa-jiwa itu naik satu per satu. Para makhluk berlutut, kembali menjadi manusia, dan tersenyum untuk pertama kalinya.`,`The souls rose one by one. The creatures knelt, became human again, and smiled for the first time.`],['Laras',`Kak, fajarnya cantik, ya.`,`Brother, the dawn is beautiful, isn't it.`]],
  epi:{id:`Ending 6 · Fajar. Kelam Sari runtuh menjadi debu, dan matahari terbit di atas dua kakak beradik yang akhirnya bebas.`,en:`Ending 6 · Dawn. Kelam Sari crumbles to dust, and the sun rises on two siblings finally free.`}}];
const OPEN=[['',`Kediaman Kelam Sari, 1998. Rumah megah itu sudah kosong puluhan tahun.`,`Kelam Sari Manor, 1998. The grand house has stood empty for decades.`],['Raka',`Tiga hari lalu adikku, Laras, masuk ke sini. Ponselnya terakhir aktif dari dalam rumah ini.`,`Three days ago my sister Laras walked in here. Her phone last pinged from inside this house.`],['Raka',`Aku tidak punya pilihan. Aku harus masuk.`,`I have no choice. I have to go in.`]];

function startFromList(i){initAudio();goFS();hideAllOv();RUN.notes=SAVE.notes.slice();RUN.souls=SAVE.souls.slice();startChapter(i,{})}
function pauseGame(){if(state!=='play')return;state='pause';resetInput();if(document.exitPointerLock)document.exitPointerLock();if(AC)AC.suspend();$('pauseObj').textContent=$('oc').textContent+'\n'+$('ot').textContent;showOv('pause',true)}
function resumeGame(){if(state!=='pause')return;showOv('pause',false);showOv('settings',false);if(AC)AC.resume();last=performance.now();state='play'}
function togglePause(){if(state==='play')pauseGame();else if(state==='pause'&&!$('settings').classList.contains('show'))resumeGame()}
let setFrom='lobby';
function openSettings(from){setFrom=from;showOv(from,false);syncUI();showOv('settings',true)}
function closeSettings(){showOv('settings',false);showOv(setFrom,true)}
function openChaps(){const l=$('chapList');l.innerHTML='';CH.forEach((c,i)=>{const b=document.createElement('button');b.className='it';const ok=i<=SAVE.unlocked;b.disabled=!ok;b.innerHTML='<b>'+tr('chap')+' '+(i+1)+'</b> · '+Lg(c.t)+'<small>'+Lg(c.sub)+(ok?'':' — '+tr('lockedTxt'))+'</small>';b.onclick=()=>{sfxClick();startFromList(i)};l.appendChild(b)});showOv('lobby',false);showOv('chaps',true)}
function openEnds(){const l=$('endList');l.innerHTML='';ENDS.forEach((e,i)=>{const d=document.createElement('div');d.className='it';const ok=SAVE.endings.includes(i);d.innerHTML=ok?'<b>'+(i+1)+'. '+Lg(e.t)+'</b><small>'+Lg(e.epi)+'</small>':'<b>'+(i+1)+'. '+tr('lockedEnd')+'</b><small>'+Lg(e.hint)+'</small>';l.appendChild(d)});$('endCount').textContent=tr('endCount').replace('{n}',SAVE.endings.length);showOv('lobby',false);showOv('ends',true)}
const GK={low:'gLow',med:'gMed',high:'gHigh'};
function applyLang(){document.documentElement.lang=S.lang;document.querySelectorAll('[data-i]').forEach(e=>{e.textContent=tr(e.dataset.i)});
 [...$('sGfx').options].forEach(o=>o.textContent=tr(GK[o.value]));[...$('sFps').options].forEach(o=>o.textContent=o.value==='0'?tr('fpsMax'):o.value+' FPS');
 $('lgId').classList.toggle('on',S.lang==='id');$('lgEn').classList.toggle('on',S.lang==='en');document.title=S.lang==='en'?'KELAM SARI — 3D Horror Game 18+':'KELAM SARI — Game Horor 3D 18+';if(LV&&state!=='boot')refreshObjective()}
function vl(){$('vVol').textContent=Math.round(S.vol*100)+'%';$('vAmb').textContent=Math.round(S.amb*100)+'%';$('vSfx').textContent=Math.round(S.sfx*100)+'%';$('vSens').textContent=S.sens.toFixed(1)+'×';$('vBr').textContent=Math.round(S.bright*100)+'%'}
function syncUI(){$('sLang').value=S.lang;$('sVol').value=S.vol;$('sAmb').value=S.amb;$('sSfx').value=S.sfx;$('sGfx').value=S.gfx;$('sFps').value=String(S.fps);$('sSens').value=S.sens;$('sBr').value=S.bright;$('sShow').checked=S.showFps;vl()}
const bind=(id,fn,ev)=>$(id).addEventListener(ev||'input',()=>{fn($(id));saveS();vl()});
bind('sLang',e=>{S.lang=e.value;applyLang()},'change');bind('sVol',e=>{S.vol=+e.value;applyVol()});bind('sAmb',e=>{S.amb=+e.value;applyVol()});bind('sSfx',e=>{S.sfx=+e.value;applyVol()});
bind('sGfx',e=>{S.gfx=e.value;onResize()},'change');bind('sFps',e=>{S.fps=+e.value},'change');bind('sSens',e=>{S.sens=+e.value});bind('sBr',e=>{S.bright=+e.value});
bind('sShow',e=>{S.showFps=e.checked;$('fps').style.display=e.checked?'block':'none'},'change');
$('sSfx').addEventListener('change',()=>{initAudio();sfxStep(.5,'wood');setTimeout(()=>sfxStep(.5,'wood'),300)});
const setLang=l=>{S.lang=l;saveS();applyLang();syncUI()};
$('lgId').addEventListener('click',()=>setLang('id'));$('lgEn').addEventListener('click',()=>setLang('en'));
$('bNew').addEventListener('click',newGame);$('bCont').addEventListener('click',contGame);$('bChaps').addEventListener('click',openChaps);$('bEnds').addEventListener('click',openEnds);
$('bSet').addEventListener('click',()=>openSettings('lobby'));$('pSet').addEventListener('click',()=>openSettings('pause'));$('sBack').addEventListener('click',closeSettings);
$('chapBack').addEventListener('click',()=>{showOv('chaps',false);showOv('lobby',true)});$('endBack').addEventListener('click',()=>{showOv('ends',false);showOv('lobby',true)});
$('pResume').addEventListener('click',resumeGame);$('pQuit').addEventListener('click',()=>{if(AC)AC.resume();toLobby()});
$('retry').addEventListener('click',respawn);$('esLobby').addEventListener('click',toLobby);$('esAgain').addEventListener('click',toLobby);
document.addEventListener('pointerdown',()=>{if(!AC)initAudio()});
document.addEventListener('click',e=>{if(e.target.closest&&e.target.closest('.btn2,.langq button,.list button'))sfxClick()});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&state==='play')pauseGame()});

/* ================= LOOP ================= */
let last=0,lastFrame=0,fpsAcc=0,fpsN=0;
function loop(t){requestAnimationFrame(loop);try{loop2(t)}catch(e){showErr(e)}}
function loop2(t){
 const cap=S.fps;if(cap>0&&t-lastFrame<1000/cap-2)return;
 const dt=Math.min(.05,(t-last)/1000||0);last=t;lastFrame=t;
 if(state==='play'){updPlay(dt);if(state==='play')syncCam()}
 else if(state==='scare')updScare(dt);
 else if(state==='text'){typeTick(dt);tm+=dt;syncCam();if(LV)for(const m of LV.mons)if(m.o.visible)m.o.userData.tick(tm,false,false)}
 else if(state==='cut'){tm+=dt;updCut(dt)}
 else if(state==='lobby')updLobby(dt);
 if(state!=='pause'){updFX(dt);updLights(dt);if(EXT&&EXT.visible&&!LV){}renderer.render(scene,camera)}
 fpsAcc+=dt;fpsN++;if(fpsAcc>=.5){if(S.showFps)$('fps').textContent=Math.round(fpsN/fpsAcc)+' FPS';fpsAcc=0;fpsN=0}}

/* ================= BOOT ================= */
function boot(){
 buildTex();initUnits();initThree();buildExterior();applyLang();syncUI();$('fps').style.display=S.showFps?'block':'none';
 state='lobby';lobbyScene();$('bCont').disabled=SAVE.cur<0;requestAnimationFrame(loop)}
try{boot()}catch(e){const b=$('err');b.style.display='block';b.textContent='Boot error: '+e.message}
window.__dbg={startChapter,loadChapter,CH,Pl,get G(){return G},get LV(){return LV}};

</script>
<script>
if('serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost')){window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{})})}
</script>
